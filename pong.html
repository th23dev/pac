<!-- Interface do componente Pong do Streamlit. -->
<style>
* { box-sizing: border-box; }
  .game { margin: 0; font-family: var(--st-font, sans-serif); font-size: 16px; color: var(--st-text-color, #31333f); }
  .score { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
  .score > div { border: 1px solid var(--st-border-color, #80808040); border-radius: var(--st-base-radius, 8px); padding: 12px 16px; }
  .score span { display: block; font-size: 14px; }
  .score strong { display: block; font-size: 32px; font-weight: 400; line-height: 1.3; }
  canvas { width: 100%; max-width: 400px; height: auto; display: block; margin: auto; background: var(--st-secondary-background-color, #f0f2f6); border: 1px solid var(--st-border-color, #80808040); border-radius: var(--st-base-radius, 8px); touch-action: none; }
  canvas:focus-visible, button:focus-visible { outline: 2px solid var(--st-primary-color, #ff4b4b); outline-offset: 2px; }
  .controls { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 16px; }
  button { min-height: 38px; padding: 6px 12px; border: 1px solid var(--st-border-color, #80808040); border-radius: var(--st-button-radius, 8px); cursor: pointer; font: inherit; background: var(--st-background-color, white); color: var(--st-text-color, #31333f); }
  button:hover:enabled { border-color: var(--st-primary-color, #ff4b4b); color: var(--st-primary-color, #ff4b4b); }
  button:disabled { opacity: .4; cursor: default; }
</style>
<div class="game">
  <div class="score"><div><span>Pontos</span><strong id="points">0</strong></div><div><span>Recorde</span><strong id="record">0</strong></div></div>
  <canvas id="court" width="400" height="600" tabindex="0" aria-label="Pong vertical: você está embaixo. Mova a raquete com as setas esquerda e direita, A e D, mouse ou toque."></canvas>
  <div class="controls"><button id="start">Iniciar partida</button><button id="pause" disabled>Pausar</button></div>
</div>
<script type="module">
export default function({parentElement, data, setStateValue}) {

  const canvas = parentElement.getElementById('court'), ctx = canvas.getContext('2d');
  canvas.report = value => setStateValue('resultado', value);
  if (canvas.receive) { canvas.receive(data); return; }
  const startButton = parentElement.getElementById('start'), pauseButton = parentElement.getElementById('pause');
  const W = 400, H = 600, paddleW = 80, paddleH = 12, radius = 8;
  let player = 160, bot = 160, ball, points = 0, record = 0, savedRecord = 0, finished = false;
  let running = false, paused = false, lastTime = 0, serveDelay = 0, playerId = null;
  const keys = new Set();
  function serve(direction = 1) {
    ball = {x: W / 2, y: H / 2, vx: (Math.random() > .5 ? 1 : -1) * 140, vy: direction * 300};
    serveDelay = .7;
  }
  function scoreboard() {
    parentElement.getElementById('points').textContent = points;
    parentElement.getElementById('record').textContent = record;
  }
  function report() {
    canvas.report({email: playerId, pontos: points});
  }
  canvas.receive = args => {
    playerId = args.email;
    savedRecord = Number(args.recorde) || 0;
    record = Math.max(record, savedRecord);
    scoreboard();
  };
  canvas.receive(data);
  function togglePause() {
    if (!running) return;
    paused = !paused;
    keys.clear();
    pauseButton.textContent = paused ? 'Continuar' : 'Pausar';
  }
  startButton.onclick = () => {
    points = 0; finished = false; player = bot = 160; running = true; paused = false;
    pauseButton.disabled = false; pauseButton.textContent = 'Pausar'; startButton.textContent = 'Reiniciar partida';
    keys.clear(); serve(); scoreboard(); canvas.focus();
  };
  pauseButton.onclick = () => { togglePause(); canvas.focus(); };
  canvas.addEventListener('keydown', event => {
    const key = event.key.toLowerCase();
    if (['arrowleft', 'arrowright', 'a', 'd', ' '].includes(key)) {
      event.preventDefault();
      if (key === ' ' && !event.repeat) togglePause();
      else keys.add(key);
    }
  });
  canvas.addEventListener('keyup', event => keys.delete(event.key.toLowerCase()));
  canvas.addEventListener('blur', event => {
    keys.clear();
    if (event.relatedTarget !== pauseButton && running && !paused) togglePause();
  });
  function movePointer(event) {
    const bounds = canvas.getBoundingClientRect();
    player = Math.max(0, Math.min(W - paddleW, (event.clientX - bounds.left) * W / bounds.width - paddleW / 2));
  }
  canvas.addEventListener('pointermove', movePointer);
  canvas.addEventListener('pointerdown', event => { canvas.focus(); canvas.setPointerCapture(event.pointerId); movePointer(event); });
  function bounce(paddle, direction) {
    const angle = ((ball.x - paddle - paddleW / 2) / (paddleW / 2 + radius)) * Math.PI / 3;
    const speed = Math.min(620, Math.hypot(ball.vx, ball.vy) + 22);
    ball.vx = speed * Math.sin(angle); ball.vy = direction * speed * Math.cos(angle);
  }
  function update(dt) {
    if (keys.has('arrowleft') || keys.has('a')) player -= 440 * dt;
    if (keys.has('arrowright') || keys.has('d')) player += 440 * dt;
    player = Math.max(0, Math.min(W - paddleW, player));
    const target = ball.vy < 0 ? ball.x - paddleW / 2 : W / 2 - paddleW / 2;
    bot += Math.max(-230 * dt, Math.min(230 * dt, target - bot));
    bot = Math.max(0, Math.min(W - paddleW, bot));
    if (serveDelay > 0) { serveDelay -= dt; return; }
    ball.x += ball.vx * dt; ball.y += ball.vy * dt;
    if (ball.x < radius) { ball.x = radius; ball.vx = Math.abs(ball.vx); }
    if (ball.x > W - radius) { ball.x = W - radius; ball.vx = -Math.abs(ball.vx); }
    if (ball.vy > 0 && ball.y + radius >= H - 36 && ball.y <= H - 24 && ball.x + radius >= player && ball.x - radius <= player + paddleW) {
      ball.y = H - 36 - radius; bounce(player, -1);
    }
    if (ball.vy < 0 && ball.y - radius <= 36 && ball.y >= 24 && ball.x + radius >= bot && ball.x - radius <= bot + paddleW) {
      ball.y = 36 + radius; bounce(bot, 1);
    }
    if (ball.y < -radius) {
      points++;
      if (points > savedRecord) { record = Math.max(record, points); report(); }
      scoreboard(); serve(1);
    } else if (ball.y > H + radius) {
      running = false; finished = true; pauseButton.disabled = true;
    }
  }
  function draw() {
    const style = getComputedStyle(canvas);
    const text = style.getPropertyValue('--st-text-color').trim() || '#31333f';
    const primary = style.getPropertyValue('--st-primary-color').trim() || '#ff4b4b';
    const background = style.getPropertyValue('--st-secondary-background-color').trim() || '#f0f2f6';
    const border = style.getPropertyValue('--st-border-color').trim() || '#80808040';
    ctx.clearRect(0, 0, W, H);
    ctx.strokeStyle = border; ctx.setLineDash([8, 10]); ctx.beginPath(); ctx.moveTo(0, H / 2); ctx.lineTo(W, H / 2); ctx.stroke();
    ctx.fillStyle = primary; ctx.fillRect(player, H - 36, paddleW, paddleH);
    ctx.fillStyle = text; ctx.fillRect(bot, 24, paddleW, paddleH);
    ctx.beginPath(); ctx.arc(ball.x, ball.y, radius, 0, Math.PI * 2); ctx.fill();
    if (!running || paused) {
      ctx.globalAlpha = .9; ctx.fillStyle = background; ctx.fillRect(0, 0, W, H); ctx.globalAlpha = 1;
      ctx.fillStyle = text; ctx.font = `24px ${style.fontFamily}`; ctx.textAlign = 'center';
      ctx.fillText(paused ? 'Pausado' : finished ? 'Fim de jogo' : 'Pong', W / 2, H / 2);
    }
  }
  function frame(time) {
    if (!canvas.isConnected) return;
    const dt = Math.min((time - lastTime) / 1000 || 0, .032); lastTime = time;
    if (running && !paused) update(dt);
    draw(); requestAnimationFrame(frame);
  }
  serve(); scoreboard(); requestAnimationFrame(frame);


}
</script>
